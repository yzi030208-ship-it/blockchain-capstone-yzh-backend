plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
    id "org.web3j" version "4.14.0"
}

group = 'com.wetech.demo.web3j'
version = '1.0-SNAPSHOT'
sourceCompatibility = '21'
targetCompatibility = '21'
repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Web3j
    implementation 'org.web3j:core:4.14.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

web3j {
    generatedPackageName = 'com.wetech.demo.web3j.contracts.{0}'
    generatedFilesBaseDir = 'src'
}

// Pin the course compiler rather than resolving the newest 0.8.x release.
// A local native compiler can be supplied without changing the shared build.
solidity {
    version = '0.8.20'
    evmVersion = org.web3j.solidity.gradle.plugin.EVMVersion.PARIS
    if (findProperty('solcExecutable')) {
        executable = file(findProperty('solcExecutable')).absolutePath
    }
}

// The course WSL image already supplies Node.js and npm. Avoid downloading
// a second Node distribution during every fresh checkout.
node {
    download = false
}

// The YZH baseline can build before DHT has added the final Escrow source.
// This Web3j plugin release does not expose SolidityExtension.compilerEnabled,
// so disable its compiler task chain until DHT explicitly opts in.
def compileContracts = (findProperty('compileContracts') ?: 'false').toBoolean()
tasks.matching { it.name in [
        'extractSolidityImports', 'nodeSetup', 'npmSetup', 'npmInstall',
        'resolveSolidity', 'compileSolidity', 'generateContractWrappers'
] }.configureEach {
    enabled = compileContracts
}

sourceSets {
    main {
        solidity {
            srcDir "src/main/resources/contracts"
        }
    }
}

test {
    useJUnitPlatform()
}

// Check if the task exists before setting dependencies
tasks.whenTaskAdded { task ->
    if (task.name == 'generateContractWrappers') {
        task.dependsOn(tasks.named('processResources'))
    }
}
